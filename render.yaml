# Render Blueprint: one free web service. The free plan has no disk, so members,
# approvals and bankrolls reset whenever the service restarts or wakes from sleep.
services:
  - type: web
    name: royalfelt-poker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PIN
        sync: false
